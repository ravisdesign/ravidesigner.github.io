<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ravi's Design - Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header Section -->
  <header>
    <h1>Ravi's Design</h1>
    <p class="tagline">Thumbnail Designer & Media Artist</p>
    <div class="social-links">
      <span><strong>Discord:</strong> @ravijddnd</span>
      <span><strong>Instagram:</strong> @realravixog</span>
    </div>
  </header>

  <!-- Pricing Section -->
  <section class="pricing-section">
    <h2>Services & Pricing</h2>
    <div class="pricing-cards">
      <div class="card">
        <h3>Thumbnails</h3>
        <p class="price">₹100 - ₹150 <span>/ unit</span></p>
      </div>
      <div class="card">
        <h3>Profile Pictures (PFP)</h3>
        <p class="price">₹30 <span>/ unit</span></p>
      </div>
    </div>
  </section>

  <!-- Portfolio Showcase -->
  <main class="portfolio-section">
    
    <!-- Thumbnails Gallery (5 Slots) -->
    <section>
      <h2>Thumbnail Showcase</h2>
      <div class="grid thumbnails-grid">
        <div class="portfolio-item">
          <img src="images/thumb1.png" alt="Thumbnail 1">
        </div>
        <div class="portfolio-item">
          <img src="images/thumb2.png" alt="Thumbnail 2">
        </div>
        <div class="portfolio-item">
          <img src="images/thumb3.png" alt="Thumbnail 3">
        </div>
        <div class="portfolio-item">
          <img src="images/thumb4.png" alt="Thumbnail 4">
        </div>
        <div class="portfolio-item">
          <img src="images/thumb5.png" alt="Thumbnail 5">
        </div>
      </div>
    </section>

    <!-- PFP Gallery (3 Slots) -->
    <section>
      <h2>Profile Picture Showcase</h2>
      <div class="grid pfp-grid">
        <div class="portfolio-item pfp-item">
          <img src="images/pfp1.png" alt="Profile Picture 1">
        </div>
        <div class="portfolio-item pfp-item">
          <img src="images/pfp2.png" alt="Profile Picture 2">
        </div>
        <div class="portfolio-item pfp-item">
          <img src="images/pfp3.png" alt="Profile Picture 3">
        </div>
      </div>
    </section>

  </main>

  <footer>
    <p>Interested in working together? Reach out via Discord or Instagram!</p>
  </footer>

</body>
</html>
