<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ravi's Design - Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header Section -->
  <header>
    <h1>Ravi's Design</h1>
    <p class="tagline">Thumbnail & Profile Picture Designer</p>
    
    <!-- Contact Info -->
    <div class="social-links">
      <a href="https://instagram.com/realravixog" target="_blank" class="social-badge instagram">
        <strong>Instagram:</strong> @realravixog
      </a>
      <div class="social-badge discord">
        <strong>Discord:</strong> @ravijddnd
      </div>
    </div>
  </header>

  <!-- Pricing Section -->
  <section class="pricing-section">
    <h2>Services & Pricing</h2>
    <div class="pricing-cards">
      <div class="card">
        <h3>Thumbnail</h3>
        <p class="price">₹100 - ₹150 <span class="unit">/ each</span></p>
      </div>
      <div class="card">
        <h3>Profile Picture (PFP)</h3>
        <p class="price">₹30 <span class="unit">/ each</span></p>
      </div>
    </div>
  </section>

  <!-- Portfolio Showcase -->
  <main class="portfolio-section">
    
    <!-- Thumbnails Gallery (5 Slots) -->
    <section>
      <h2>Thumbnails</h2>
      <div class="grid thumbnails-grid">
        <div class="portfolio-item">
          <img src="images/thumb1.png" alt="Thumbnail 1">
        </div>
        <div class="portfolio-item">
          <img src="images/thumb2.png" alt="Thumbnail 2">
        </div>
        <div class="portfolio-item">
          <img src="images/thumb3.png" alt="Thumbnail 3">
        </div>
        <div class="portfolio-item">
          <img src="images/thumb4.png" alt="Thumbnail 4">
        </div>
        <div class="portfolio-item">
          <img src="images/thumb5.png" alt="Thumbnail 5">
        </div>
      </div>
    </section>

    <!-- PFP Gallery (3 Slots) -->
    <section>
      <h2>Profile Pictures</h2>
      <div class="grid pfp-grid">
        <div class="portfolio-item pfp-item">
          <img src="images/pfp1.png" alt="Profile Picture 1">
        </div>
        <div class="portfolio-item pfp-item">
          <img src="images/pfp2.png" alt="Profile Picture 2">
        </div>
        <div class="portfolio-item pfp-item">
          <img src="images/pfp3.png" alt="Profile Picture 3">
        </div>
      </div>
    </section>

  </main>

  <footer>
    <p>DM me on <strong>Discord (@ravijddnd)</strong> or <strong>Instagram (@realravixog)</strong> to order!</p>
  </footer>

</body>
</html>
